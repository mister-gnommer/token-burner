name: Publish standupers graph

on:
  push:
    branches: [main]
    paths:
      - tasks/standupers-graph/graph/**
      - tasks/standupers-graph/scripts/build_site.sh
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}standupers/
    steps:
      - uses: actions/checkout@v4
      - name: Build site from newest batch
        run: bash tasks/standupers-graph/scripts/build_site.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
